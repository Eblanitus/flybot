<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аудит мухи</title>
<style>
  :root {
    --bg: #12151b; --panel: #1b2029; --panel2: #232a36; --line: #2e3745; --text: #e8ecf2; --dim: #98a3b5;
    --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --blue: #60a5fa; --violet: #c4a1ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: #0d1015; border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: .3px; }
  .lamps { display: flex; gap: 10px; flex-wrap: wrap; flex: 1; }
  .lamp { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px 4px 10px; display: flex; gap: 8px; align-items: center; font-size: 15px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #555; flex: none; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
  .clock { color: var(--dim); font-size: 14px; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px 0; }
  nav button { background: var(--panel); color: var(--dim); border: 1px solid var(--line); border-radius: 10px 10px 0 0; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  nav button.on { color: var(--text); background: var(--panel2); border-bottom-color: var(--panel2); box-shadow: inset 0 3px 0 var(--blue); }
  main { padding: 0 16px 40px; }
  .pane { display: none; background: var(--panel2); border: 1px solid var(--line); border-radius: 0 12px 12px 12px; padding: 16px; min-height: 60vh; }
  .pane.on { display: block; }
  h2 { font-size: 19px; margin: 18px 0 8px; } h2:first-child { margin-top: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .card .t { color: var(--dim); font-size: 14px; margin-bottom: 4px; }
  .card .v { font-size: 26px; font-weight: 700; }
  .card .s { color: var(--dim); font-size: 15px; margin-top: 2px; word-break: break-word; }
  .bar { height: 12px; background: #0d1015; border-radius: 6px; overflow: hidden; margin-top: 8px; } .bar i { display: block; height: 100%; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; white-space: pre-wrap; word-break: break-word; }
  .feed { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; max-height: 62vh; overflow: auto; }
  .row { display: flex; gap: 12px; padding: 7px 14px; border-bottom: 1px solid var(--line); align-items: baseline; }
  .row:last-child { border-bottom: 0; }
  .row .tm { color: var(--dim); font-variant-numeric: tabular-nums; flex: none; width: 92px; font-size: 14px; }
  .row .who { flex: none; width: 96px; font-weight: 700; font-size: 14px; }
  .row .tx { flex: 1; word-break: break-word; white-space: pre-wrap; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); } .dim { color: var(--dim); } .blue { color: var(--blue); } .violet { color: var(--violet); }
  .tag { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: 14px; font-weight: 700; border: 1px solid currentColor; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-size: 14px; font-weight: 600; }
  tr.click { cursor: pointer; } tr.click:hover td { background: #202733; }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
  .err { color: var(--bad); padding: 10px 0; }
  label.chk { margin-right: 18px; color: var(--dim); font-size: 15px; cursor: pointer; }
  .small { font-size: 14px; }
  .msg { padding: 8px 14px; border-bottom: 1px solid var(--line); }
  .msg .meta { font-size: 13px; color: var(--dim); }
  .msg.owner { background: #1d2a1f; } .msg.brain { background: #1d2540; } .msg.system { opacity: .6; }
  .compose { display: flex; gap: 10px; margin-top: 12px; }
  .compose textarea { flex: 1; background: #0d1015; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; resize: vertical; min-height: 56px; }
  .compose button { background: var(--blue); color: #08111f; border: 0; border-radius: 10px; padding: 0 22px; font: inherit; font-weight: 700; cursor: pointer; }
  .compose button:disabled { opacity: .5; cursor: default; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 14px/1.4 Consolas, monospace; }
  .card .mdv { font-size: 18px; word-break: break-all; }
  .mdctl { display: block; width: 100%; background: #0d1015; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit; margin: 4px 0 10px; }
  .btn { background: var(--blue); color: #08111f; border: 0; border-radius: 10px; padding: 8px 20px; font: inherit; font-weight: 700; cursor: pointer; }
  .btn:disabled { opacity: .5; cursor: default; }
  .con { background: #0a0c10; border: 1px solid var(--line); border-radius: 12px; height: 64vh; overflow: auto; padding: 6px 0; font: 13.5px/1.45 Consolas, "Cascadia Mono", monospace; }
  .cl { display: flex; gap: 10px; padding: 1px 12px; }
  .cl:hover { background: #141922; }
  .cl .ct { flex: none; width: 84px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .cl .ct.ax { color: #6f7889; font-style: italic; }
  .cl .cr { flex: none; width: 70px; font-weight: 700; }
  .cl .cx { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; }
  .cl.k-start { background: #1a1630; } .cl.k-modelerr { background: #3a1518; } .cl.k-fail, .cl.k-err { background: #2a1416; }
  .ctag { color: #7dd3fc; } .ccmd { color: #9be7a6; }
  .cbody { color: #aab3c2; margin: 2px 0; border-left: 2px solid var(--line); padding-left: 8px; }
  .cbody .dp { color: var(--ok); } .cbody .dm { color: var(--bad); } .cbody .dh { color: var(--violet); }
  .cfold { color: var(--dim); cursor: pointer; text-decoration: underline dotted; }
  .cfold:hover { color: var(--text); }
  .conbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0 8px; }
  .seg { background: var(--panel); color: var(--dim); border: 1px solid var(--line); border-radius: 8px; padding: 5px 14px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  .seg.on { color: var(--text); border-color: var(--blue); }
  .consel { background: #0d1015; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font: inherit; font-size: 14px; max-width: 420px; }
  .btn2 { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 5px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  .btn2:disabled { opacity: .5; cursor: default; }
  .card .rv { font-size: 19px; font-weight: 700; }
  .detail { background: #0d1015; border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin: 10px 0; }
</style>
</head>
<body>
<header>
  <h1>Аудит мухи</h1>
  <div class="lamps" id="lamps"></div>
  <div class="clock" id="clock"></div>
</header>
<nav id="tabs"></nav>
<main>
  <section class="pane" id="p-console"></section>
  <section class="pane" id="p-body"></section>
  <section class="pane" id="p-reflex"></section>
  <section class="pane" id="p-brain"></section>
  <section class="pane" id="p-engineer"></section>
  <section class="pane" id="p-deaths"></section>
  <section class="pane" id="p-teacher"></section>
  <section class="pane" id="p-skills"></section>
  <section class="pane" id="p-showcase"></section>
  <section class="pane" id="p-models"></section>
  <section class="pane" id="p-service"></section>
  <section class="pane" id="p-chat"></section>
</main>

<script>
'use strict';
const TABS = [['console', 'Консоль ролей'], ['body', 'Тело'], ['reflex', 'Автопилот и рефлексы'], ['brain', 'Мозг'], ['engineer', 'Инженер'], ['deaths', 'Смерти и дни'], ['teacher', 'Учитель'], ['skills', 'Навыки'], ['showcase', 'Витрина'], ['models', 'Модели'], ['service', 'Служебное'], ['chat', 'Чат']];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad = n => String(n).padStart(2, '0');

// время — всегда местное (браузер хозяина)
function tm(ts) {
  if (ts == null) return '—';
  const d = new Date(ts), n = new Date();
  const hms = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  return d.toDateString() === n.toDateString() ? hms : pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + ' ' + hms;
}
function ago(ts, now) {
  if (ts == null) return '';
  let s = Math.max(0, Math.round(((now || Date.now()) - ts) / 1000));
  if (s < 60) return s + ' с назад';
  if (s < 3600) return Math.round(s / 60) + ' мин назад';
  if (s < 86400) return Math.round(s / 3600) + ' ч назад';
  return Math.round(s / 86400) + ' дн назад';
}
const ITEMS = { stick: 'палки', cobblestone: 'булыжник', dirt: 'земля', coal: 'уголь', raw_copper: 'сырая медь', raw_iron: 'сырое железо', copper_ingot: 'медь (слиток)', iron_ingot: 'железо (слиток)',
  spruce_log: 'ель (бревно)', spruce_planks: 'ель (доски)', oak_log: 'дуб (бревно)', torch: 'факелы', crafting_table: 'верстак', furnace: 'печь', bed: 'кровать', andesite: 'андезит',
  wooden_sword: 'деревянный меч', wooden_pickaxe: 'деревянная кирка', wooden_axe: 'деревянный топор', stone_sword: 'каменный меч', stone_pickaxe: 'каменная кирка', stone_axe: 'каменный топор',
  iron_sword: 'железный меч', iron_pickaxe: 'железная кирка', copper_helmet: 'медный шлем', copper_chestplate: 'медная кираса', copper_leggings: 'медные поножи', copper_boots: 'медные ботинки',
  leather_helmet: 'кожаный шлем', leather_chestplate: 'кожаная кираса', leather_leggings: 'кожаные поножи', leather_boots: 'кожаные ботинки', rotten_flesh: 'гнилая плоть', bread: 'хлеб', cooked_beef: 'жареная говядина' };
const itemRu = n => ITEMS[n] || n;
const MOB = { zombie: 'зомби', skeleton: 'скелет', stray: 'зимний скелет', spider: 'паук', creeper: 'крипер', cave_spider: 'пещерный паук', enderman: 'эндермен', witch: 'ведьма', drowned: 'утопленник', husk: 'кадавр', pillager: 'разбойник' };
const mobRu = n => MOB[n] || n;

// ---------- вкладки ----------
let cur = (() => { try { return localStorage.getItem('audit.tab') || 'console'; } catch (e) { return 'console'; } })();
if (!TABS.some(t => t[0] === cur)) cur = 'console';
function drawTabs() {
  $('tabs').innerHTML = TABS.map(([id, name]) => `<button data-t="${id}" class="${id === cur ? 'on' : ''}">${name}</button>`).join('');
  TABS.forEach(([id]) => $('p-' + id).classList.toggle('on', id === cur));
}
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  cur = b.dataset.t; try { localStorage.setItem('audit.tab', cur); } catch (er) {}
  drawTabs(); tick();
});

async function get(path) {
  const r = await fetch(path, { cache: 'no-store' });
  return r.json();
}

// ---------- шапка ----------
function lamp(cls, text) { return `<div class="lamp"><span class="dot ${cls}"></span><span>${esc(text)}</span></div>`; }
function drawLamps(s) {
  let h = '';
  if (!s.body.ok) h += lamp('bad', 'Тело: не отвечает');
  else if (!s.body.ready) h += lamp('warn', 'Тело: запущено, но не в игре');
  else h += lamp('ok', `Тело: HP ${Math.round(s.body.hp)}/20, еда ${s.body.food}/20`);
  h += !s.runner.ok ? lamp('bad', 'Исполнитель: не отвечает') : s.runner.active ? lamp('ok', `Исполнитель: ${s.runner.active.name} (${s.runner.active.sec} с)`) : lamp('ok', 'Исполнитель: свободен');
  const b = s.brain;
  if (!b.file) h += lamp('bad', 'Мозг: нет журнала');
  else h += lamp(b.state === 'ok' ? 'ok' : b.state === 'slow' ? 'warn' : 'bad', `Мозг: журнал обновлялся ${ago(b.mtimeMs, s.now)}`);
  const R = s.roles;
  if (R) {
    for (const [r, name] of [['teacher', 'Учитель'], ['engineer', 'Инженер']]) {
      const x = R[r];
      if (x.working && x.modelError && x.modelError.fresh) h += lamp('bad', `${name}: ошибка модели — ${clipS(x.modelError.text, 60)}`);
      else if (x.working) h += lamp('ok', `${name}: работает${x.session ? ' ' + Math.round((s.now - x.session.S) / 60000) + ' мин' : ''}`);
      else h += lamp('', `${name}: свободен${x.pending ? ', ждут ' + x.pending : ''}`);
    }
    if (R.guard.working === false) h += lamp('bad', 'Сторож: не запущен');
  }
  $('lamps').innerHTML = h;
  $('clock').textContent = 'обновлено ' + tm(s.now);
}

// ---------- Консоль ролей ----------
// Журналы ролей как в терминале: старое сверху, новое снизу. Сам прокручивается вниз, только если ты внизу.
const ROLE_RU = { brain: 'мозг', teacher: 'учитель', engineer: 'инженер', guard: 'сторож', model: 'модель' };
const ROLE_CLS = { brain: 'blue', teacher: 'violet', engineer: 'warn', guard: 'dim', model: 'bad' };
const CON_TABS = [['all', 'Все роли'], ['brain', 'Мозг'], ['teacher', 'Учитель'], ['engineer', 'Инженер'], ['guard', 'Сторож']];
const FILE_ROLES = ['brain', 'teacher', 'engineer'];
let conRole = (() => { try { return localStorage.getItem('audit.con') || 'all'; } catch (e) { return 'all'; } })();
if (!CON_TABS.some(t => t[0] === conRole)) conRole = 'all';
const conPin = {};          // роль -> журнал, выбранный руками (иначе — текущий журнал роли)
const conOpen = new Set();  // раскрытые ответы: роль|файл|байт
let con = null;             // что показано: {role, file, size, start, entries, errs, sig, files, more}
let conBusy = false, lastRoles = null;

function conShell() {
  $('p-console').innerHTML = `<div class="grid" id="roleCards"></div>
    <div class="conbar"><span id="conTabs"></span><select id="conFile" class="consel"></select><button class="btn2" id="conMore">Загрузить раньше</button><button class="btn2" id="conDown">Вниз</button></div>
    <div id="conNote" class="small dim" style="margin-bottom:6px"></div>
    <div class="con" id="con"></div>
    <div class="small dim" style="margin-top:6px">Слева время. <b>≈</b> — примерное: в этой строке журнала нет метки времени, время прикинуто по началу и концу сеанса роли (guard.log). «—» — время не известно.
    <span class="ok">$</span> — роль выполняет команду (запрос к телу, исполнителю или к файлам), <span class="dim">→</span> — читает файл, <span class="blue">←</span> — правит файл, <span class="bad">✗</span> — инструмент не сработал, <b class="bad">⚠</b> — ошибка модели (лимит, нет связи; её нет в журнале роли — взята из журнала opencode). Нажми «▸ …» — раскроется ответ целиком.</div>`;
  $('conTabs').onclick = e => { const b = e.target.closest('button[data-cr]'); if (b) setConRole(b.dataset.cr); };
  $('conFile').onchange = e => { conPin[conRole] = e.target.value || null; conReset(); conTick(); };
  $('conMore').onclick = conEarlier;
  $('conDown').onclick = () => { const c = $('con'); c.scrollTop = c.scrollHeight; };
  $('con').addEventListener('click', e => {
    const f = e.target.closest('[data-fold]'); if (!f) return;
    const k = f.dataset.fold; if (conOpen.has(k)) conOpen.delete(k); else conOpen.add(k);
    drawCon(true);
  });
}
function conReset() { con = null; const c = $('con'); if (c) { c.dataset.init = ''; c.innerHTML = '<div class="cl"><span class="cx dim">загружаю…</span></div>'; } }
function setConRole(r, file) {
  conRole = r; try { localStorage.setItem('audit.con', r); } catch (e) {}
  if (file !== undefined) conPin[r] = file || null;
  conReset(); conTick();
}

// Карточки ролей: работает ли, над чем, с какого времени, на какой модели
function roleCard(title, role, x, now) {
  const dot = x.working ? 'ok' : x.working === false ? '' : 'warn';
  let h = `<div class="card"><div class="t"><span class="dot ${dot}" style="display:inline-block;vertical-align:-2px;margin-right:6px"></span>${esc(title)}</div>`;
  const lines = [];
  const dur = t => ago(t, now).replace(' назад', '');
  if (role === 'brain') {
    h += `<div class="rv ${x.working ? 'ok' : 'dim'}">${x.working ? 'работает' : 'не запущен'}</div>`;
    if (x.since) lines.push('сессия с ' + tm(x.since) + (x.working ? ' (' + dur(x.since) + ')' : ''));
    if (x.what) lines.push('цель: ' + clipS(x.what, 160));
    if (x.lastWrite) lines.push('журнал ' + (x.log || '') + ': запись ' + ago(x.lastWrite, now));
  } else if (role === 'guard') {
    h += `<div class="rv ${x.working ? 'ok' : x.working === false ? 'bad' : 'dim'}">${x.working ? 'запущен' : x.working === false ? 'не запущен' : 'не известно'}</div>`;
    if (x.since) lines.push('с ' + tm(x.since));
    lines.push('следит за мозгом, по очереди запускает учителя и инженера');
    if (x.last) lines.push('последнее: ' + tm(x.last.ts) + ' — ' + clipS(x.last.text, 140));
  } else {
    const ses = x.session;
    h += `<div class="rv ${x.working ? 'ok' : 'dim'}">${x.working ? (role === 'teacher' ? 'разбирает случай' : 'пишет код') : 'свободен'}</div>`;
    if (x.working && x.what) lines.push(clipS(x.what, 200));
    if (x.working && ses) lines.push('с ' + tm(ses.S) + ' (' + dur(ses.S) + ')');
    if (!x.working && ses) lines.push('последний раз: ' + (ses.key || '') + ', ' + tm(ses.S) + (ses.E ? ' – ' + tm(ses.E) : '') + (ses.how ? ' (' + ses.how + ')' : ''));
    if (role === 'teacher' && x.pending != null) lines.push('ждут разбора: ' + x.pending);
    if (role === 'engineer') lines.push('ждут заявки на навыки: ' + (x.pending || 0) + (x.corePending ? '; запросов на правку ядра ждут твоего разрешения: ' + x.corePending : ''));
  }
  if (role !== 'guard') {
    const m = x.model || x.savedModel;
    if (m) lines.push('модель: ' + m + (x.model && x.savedModel && x.model !== x.savedModel ? ' (сохранена другая: ' + x.savedModel + ', сменится при следующем запуске)' : ''));
  }
  h += '<div class="s">' + lines.map(esc).join('<br>') + '</div>';
  const me = x.modelError;
  if (me && (me.fresh || x.working)) h += `<div class="small ${me.fresh ? 'bad' : 'dim'}" style="margin-top:4px">⚠ ошибка модели ${esc(me.model)} ${esc(ago(me.ts, now))}${me.count > 1 ? ' (за час: ' + me.count + ')' : ''}: ${esc(clipS(me.text, 160))}</div>`;
  if (role === 'guard' && x.oldVersion) h += '<div class="small warn" style="margin-top:4px">Сторож запущен до обновления brain_guard.ps1: журналы учителя и инженера пока пишутся без меток времени (в консоли время примерное). Метки появятся после перезапуска teach.cmd.</div>';
  h += `<div style="margin-top:8px"><button class="btn2" data-con="${role}">Журнал в консоли</button></div></div>`;
  return h;
}
function renderRoleCards(R, now) {
  const box = $('roleCards'); if (!box) return;
  if (!R) { box.innerHTML = '<div class="box dim">Состояние ролей не получено.</div>'; return; }
  box.innerHTML = roleCard('Мозг', 'brain', R.brain, now) + roleCard('Учитель', 'teacher', R.teacher, now) + roleCard('Инженер', 'engineer', R.engineer, now) + roleCard('Сторож', 'guard', R.guard, now);
}

async function conTick() {
  if (conBusy) return; conBusy = true;
  try {
    const role = conRole;
    const want = FILE_ROLES.includes(role) ? (conPin[role] || (lastRoles && lastRoles[role] && lastRoles[role].log) || '') : '';
    let url = '/api/console?role=' + role, from = null;
    if (con && con.role === role && con.sig) url += '&sig=' + encodeURIComponent(con.sig);
    if (con && con.role === role && FILE_ROLES.includes(role) && con.file && (!want || con.file === want) && con.entries.length) {
      from = con.entries[con.entries.length - 1].off;
      url += '&file=' + encodeURIComponent(con.file) + '&from=' + from;
    } else if (want) url += '&file=' + encodeURIComponent(want);
    const d = await get(url);
    if (conRole !== role) return;
    if (!d.ok) { $('con').innerHTML = '<div class="cl"><span class="cx bad">' + esc(d.error || 'ошибка') + '</span></div>'; return; }
    if (d.same) return;
    if (from != null && con && d.file === con.file && d.size >= con.size && (d.start === from || !d.entries.length)) {
      // дочитали хвост; последняя запись перечитана целиком — её ответ мог дописаться
      const errs = mergeErrs(con.errs, d.modelErrors);
      if (d.size === con.size && errs.length === con.errs.length) return;
      con.entries = con.entries.filter(e => e.off < from).concat(d.entries);
      con.size = d.size; con.files = d.files || con.files; con.errs = errs;
      if (con.entries.length > 6000) { con.entries = con.entries.slice(-5000); con.start = con.entries[0].off; con.more = true; }
    } else {
      const c = $('con'); if (c && (!con || con.role !== role || con.file !== (d.file || null))) c.dataset.init = '';
      con = { role, file: d.file || null, size: d.size, start: d.start, entries: d.entries || [], errs: d.modelErrors || [], sig: d.sig || null, files: d.files || [], more: !!d.more };
    }
    drawCon();
  } catch (e) {
    const c = $('con'); if (c) c.innerHTML = '<div class="cl"><span class="cx bad">консоль не загрузилась: ' + esc(e.message) + '</span></div>';
  } finally { conBusy = false; }
}
function mergeErrs(a, b) {
  const seen = new Set((a || []).map(e => e.ts + '|' + e.text)), out = (a || []).slice();
  for (const e of b || []) if (!seen.has(e.ts + '|' + e.text)) { seen.add(e.ts + '|' + e.text); out.push(e); }
  return out.sort((x, y) => x.ts - y.ts);
}
async function conEarlier() {
  if (!con || !con.more || !con.file) return;
  const btn = $('conMore'); btn.disabled = true; btn.textContent = 'загружаю…';
  try {
    const d = await get('/api/console?role=' + con.role + '&file=' + encodeURIComponent(con.file) + '&before=' + con.start);
    if (d.ok && con && d.file === con.file) {
      con.entries = d.entries.filter(e => e.off < con.start).concat(con.entries);
      con.start = d.start; con.more = !!d.more; con.errs = mergeErrs(con.errs, d.modelErrors);
      drawCon(false, true);
    }
  } catch (e) {}
  btn.textContent = 'Загрузить раньше'; btn.disabled = !(con && con.more);
}

function bodyLine(b, k) {
  if (k === 'write') { if (/^\+/.test(b)) return '<span class="dp">' + esc(b) + '</span>'; if (/^-/.test(b)) return '<span class="dm">' + esc(b) + '</span>'; if (/^@@ /.test(b)) return '<span class="dh">' + esc(b) + '</span>'; }
  return esc(b);
}
function conLine(e, all) {
  const r = e.role || con.role;
  const key = r + '|' + (e.file || con.file) + '|' + e.off;
  const t = e.ts == null ? '<span class="ct">—</span>'
    : `<span class="ct${e.approx ? ' ax' : ''}"${e.approx ? ' title="примерное время: в строке журнала нет метки"' : ''}>${e.approx ? '≈' : ''}${tm(e.ts)}</span>`;
  const who = all ? `<span class="cr ${ROLE_CLS[r] || ''}">${esc(ROLE_RU[r] || r)}</span>` : '';
  let x;
  switch (e.k) {
    case 'start': x = '<b class="violet">══ ' + esc(e.text) + ' ══</b>'; break;
    case 'model': x = '<span class="violet">▶ ' + esc(e.text) + '</span>'; break;
    case 'guard': x = '<span class="dim">' + esc(e.text) + '</span>'; break;
    case 'cmd': x = '<span class="ok">$</span> ' + (e.tag ? '<span class="ctag">[' + esc(e.tag) + ']</span> ' : '') + '<span class="ccmd">' + esc(e.text) + '</span>' + (e.say ? '\n<b class="violet">говорит в чат:</b> ' + esc(e.say) : ''); break;
    case 'read': x = '<span class="dim">→ ' + esc(e.text) + '</span>'; break;
    case 'write': x = '<span class="blue">← ' + esc(e.text) + '</span>'; break;
    case 'fail': x = '<span class="bad">✗ ' + esc(e.text) + '</span>'; break;
    case 'err': x = '<span class="bad">' + esc(e.text) + '</span>'; break;
    case 'modelerr': x = '<b class="bad">⚠ ' + esc(e.text) + '</b>'; break;
    default: x = esc(e.text);
  }
  if (e.body && e.body.length) {
    const n = e.body.length + (e.cut || 0);
    if (conOpen.has(key)) x += '<div class="cbody">' + e.body.map(b => bodyLine(b, e.k)).join('\n') + (e.cut ? '\n<span class="dim">… ещё ' + e.cut + ' строк' + (all ? ' (полностью — во вкладке роли)' : '') + '</span>' : '') + '</div><span class="cfold" data-fold="' + esc(key) + '">свернуть</span>';
    else x += '\n<span class="cfold" data-fold="' + esc(key) + '">▸ ' + esc(clipS(e.body.find(b => b.trim()) || '', 110)) + (n > 1 ? ' … (' + n + ' строк)' : '') + '</span>';
  }
  return '<div class="cl k-' + esc(e.k) + '">' + t + who + '<span class="cx">' + x + '</span></div>';
}
function drawCon(keep, prepended) {
  const box = $('con'); if (!box || !con) return;
  const all = con.role === 'all';
  const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
  const prevH = box.scrollHeight, prevTop = box.scrollTop;
  // ошибки модели — по времени между строками журнала
  const errs = (con.errs || []).map(e => ({ ...e, k: 'modelerr', off: 'e' + e.ts }));
  let h = '', j = 0;
  for (const e of con.entries) {
    if (e.ts != null) while (j < errs.length && errs[j].ts <= e.ts) h += conLine(errs[j++], all);
    h += conLine(e, all);
  }
  while (j < errs.length) h += conLine(errs[j++], all);
  box.innerHTML = h || '<div class="cl"><span class="cx dim">Журнал пуст.</span></div>';
  if (prepended) box.scrollTop = prevTop + (box.scrollHeight - prevH);
  else if (!keep && (atBottom || !box.dataset.init)) { box.scrollTop = box.scrollHeight; box.dataset.init = '1'; }
  else box.scrollTop = prevTop;
  // переключатель ролей и выбор журнала
  $('conTabs').innerHTML = CON_TABS.map(([id, n]) => `<button class="seg ${id === conRole ? 'on' : ''}" data-cr="${id}">${n}</button> `).join('');
  const sel = $('conFile');
  sel.style.display = FILE_ROLES.includes(con.role) ? '' : 'none';
  const key = JSON.stringify([con.role, con.file, (con.files || []).map(x => x.name)]);
  if (sel.dataset.key !== key) {
    sel.innerHTML = '<option value="">текущий журнал роли</option>' + (con.files || []).map(x => `<option value="${esc(x.name)}">${esc(x.name)} · ${tm(x.mtimeMs)}</option>`).join('');
    sel.value = conPin[con.role] || ''; sel.dataset.key = key;
  }
  $('conMore').style.display = FILE_ROLES.includes(con.role) ? '' : 'none';
  $('conMore').disabled = !con.more;
  let note = '';
  if (all) note = 'Все роли вместе по времени, за последние 12 часов: ' + (con.files || []).map(x => (ROLE_RU[x.role] || x.role) + ' — ' + x.name).join(', ') + '. Ответы здесь укорочены до 60 строк; полностью — во вкладке роли.';
  else if (con.role === 'guard') note = 'Журнал сторожа data/guard.log — время точное.';
  else if (con.file) note = 'Журнал data/' + con.file + ', ' + Math.round(con.size / 1024) + ' КБ' + (con.start > 0 ? ', показано с ' + Math.round(con.start / 1024) + ' КБ («Загрузить раньше» — предыдущий кусок)' : ', показан целиком') + '.';
  else note = 'У этой роли ещё нет журнала.';
  if (!all && con.entries.length && con.entries.every(e => e.ts == null || e.approx)) note += ' Меток времени в этом журнале нет — время примерное.';
  $('conNote').textContent = note;
}

// ---------- Тело ----------
function bar(v, max, color) { const p = Math.max(0, Math.min(100, (v / max) * 100)); return `<div class="bar"><i style="width:${p}%;background:${color}"></i></div>`; }
function renderBody(d) {
  if (!d.ok) return `<div class="err">${esc(d.error)}</div>`;
  const s = d.snap, p = s.position || {};
  const hpc = s.health >= 14 ? 'var(--ok)' : s.health >= 7 ? 'var(--warn)' : 'var(--bad)';
  const task = s.task;
  const armor = (s.armor || []).map(a => itemRu(typeof a === 'string' ? a : a.name)).filter(Boolean);
  const inv = s.inventory || [];
  const weapons = inv.filter(i => /_(sword|axe)$/.test(i.name)).map(i => itemRu(i.name));
  const tools = inv.filter(i => /_(pickaxe|shovel|hoe)$/.test(i.name)).map(i => itemRu(i.name));
  const en = (s.enemies || []).map(e => `${mobRu(e.name)} — ${e.d} м, ${e.dir || ''}`);
  const ag = (s.aggressors || []).map(e => typeof e === 'string' ? e : `${e.name || '?'} (бьёт меня)`);
  const th = (s.threats || []).map(e => typeof e === 'string' ? e : (e.name || e.kind || JSON.stringify(e)));
  const hz = (s.hazards || []).map(e => typeof e === 'string' ? e : (e.kind || e.name || JSON.stringify(e)));
  const ap = s.autopilot || {};
  const t = s.time || {};
  let h = '<div class="grid">';
  h += `<div class="card"><div class="t">Здоровье</div><div class="v" style="color:${hpc}">${Math.round(s.health * 10) / 10} / 20</div>${bar(s.health, 20, hpc)}</div>`;
  h += `<div class="card"><div class="t">Еда</div><div class="v">${s.food} / 20</div>${bar(s.food, 20, 'var(--warn)')}</div>`;
  h += `<div class="card"><div class="t">Где стоит</div><div class="v">${Math.round(p.x)} ${Math.round(p.y)} ${Math.round(p.z)}</div><div class="s">${esc(s.biome || '')}${s.lightLevel != null ? ', свет ' + s.lightLevel : ''}</div></div>`;
  h += `<div class="card"><div class="t">Время в игре</div><div class="v">${esc(t.phase || s.timeOfDay || '')}${t.day ? ', сутки ' + t.day : ''}</div><div class="s">${esc(s.weather || '')}${t.nightIn ? ' · ночь через ' + t.nightIn + ' с' : ''}${t.dayIn ? ' · день через ' + t.dayIn + ' с' : ''}</div></div>`;
  h += `<div class="card"><div class="t">Сейчас делает</div><div class="v">${task ? esc(task.name) : 'ничего'}</div><div class="s">${task ? esc(task.progress || '') + (task.sec != null ? ' · ' + task.sec + ' с' : '') : ''}</div></div>`;
  h += `<div class="card"><div class="t">Автопилот</div><div class="v ${ap.on ? 'ok' : 'warn'}">${ap.on ? 'включён' : 'выключен'}</div><div class="s">${ap.active ? 'сам делает: ' + esc(ap.doing) : 'мозг рулит, автопилот ждёт'}${ap.goalFailed ? '<br><span class="warn">' + esc(ap.goalFailed) + '</span>' : ''}${ap.paused && ap.paused.length ? '<br>после провала отдыхают: ' + esc(ap.paused.join(', ')) : ''}</div></div>`;
  h += `<div class="card"><div class="t">В руке</div><div class="v">${s.heldItem ? esc(itemRu(s.heldItem.name || s.heldItem)) : 'пусто'}</div><div class="s">Оружие в сумке: ${weapons.length ? esc(weapons.join(', ')) : 'нет'}<br>Инструменты: ${tools.length ? esc(tools.join(', ')) : 'нет'}</div></div>`;
  h += `<div class="card"><div class="t">Броня</div><div class="v ${armor.length ? '' : 'warn'}">${armor.length ? armor.length + ' из 4' : 'нет'}</div><div class="s">${armor.length ? esc(armor.join(', ')) : 'ничего не надето'}</div></div>`;
  const dangerCls = (en.length || ag.length || th.length || hz.length) ? 'bad' : 'ok';
  h += `<div class="card"><div class="t">Угрозы рядом</div><div class="v ${dangerCls}">${(en.length || ag.length || th.length || hz.length) ? 'есть' : 'тихо'}</div><div class="s">${[...en, ...ag.map(x => 'бьёт: ' + x), ...th, ...hz.map(x => 'опасность: ' + x)].map(esc).join('<br>') || 'врагов не видно'}</div></div>`;
  h += shelterCard(s.sheltered) + dangerCard(s.danger);
  if (s.stats) h += `<div class="card"><div class="t">За всё время</div><div class="v">${s.stats.deaths} смертей</div><div class="s">сейчас жива ${Math.round((s.stats.timeAlive || 0) / 60)} мин · пройдено ${s.stats.distanceTraveled || 0} бл.</div></div>`;
  h += '</div>';
  if (s.variantsLine) h += '<h2>Способы действий <span class="dim small">(тело выбирает способ по счёту в похожей обстановке; вся таблица — вкладка «Навыки»)</span></h2><div class="box small">' + esc(s.variantsLine) + '</div>';
  h += '<h2>Что в сумке</h2><div class="box">' + (inv.length ? inv.map(i => `${esc(itemRu(i.name))} × ${i.count}`).join(' · ') : 'пусто') + '</div>';
  if (s.memory) h += '<h2>Что помнит о мире</h2><div class="box small">' + esc(s.memory) + '</div>';
  if (s.summary) h += '<h2>Сводка тела (то, что видит мозг)</h2><div class="box small dim">' + esc(s.summary) + '</div>';
  if (d.recent && d.recent.length) h += '<h2>Последние события</h2>' + feedRows(d.recent);
  return h;

// Укрытие: крыша и 8 клеток стен вокруг (4 стороны × ноги/голова)
function shelterCard(sh) {
  if (!sh) return '<div class="card"><div class="t">Укрытие</div><div class="v dim">—</div><div class="s">тело не прислало (старое тело или не в игре)</div></div>';
  const v = sh.closed ? '<span class="ok">в укрытии</span>' : sh.roof || sh.walls ? '<span class="warn">не закрыто</span>' : '<span class="dim">открытое место</span>';
  const open = (sh.open || []).length ? 'дыры: ' + esc(sh.open.join(', ')) : '';
  return `<div class="card"><div class="t">Укрытие</div><div class="v">${v}</div><div class="s">крыша: ${sh.roof ? 'есть' : 'нет'}, стены ${esc(sh.walls)} из 8${open ? '<br>' + open : ''}${sh.skill ? '<br>навык «укрытие» считает, что муха в нём' : ''}</div></div>`;
}
// Опасность по последствию (lib/danger.js): через сколько секунд умрёт, если ничего не делать, и чем кончится бой
const WORST_RU = { mobs: 'бой', air: 'воздух', fire: 'огонь', lava: 'лава', hunger: 'голод', fall: 'падение', damage: 'урон', void: 'пустота' };
function dangerCard(dg) {
  if (!dg) return '<div class="card"><div class="t">Чем грозит</div><div class="v dim">—</div><div class="s">тело не прислало оценку опасности</div></div>';
  if (dg.error) return `<div class="card"><div class="t">Чем грозит</div><div class="v bad">ошибка</div><div class="s">${esc(dg.error)}</div></div>`;
  const w = dg.worst, lines = []; // строки — уже готовая разметка
  const v = w ? `<span class="${w.ttdSec <= 5 ? 'bad' : 'warn'}">${esc(WORST_RU[w.kind] || w.kind)}: смерть через ${esc(w.ttdSec)} с</span>` : '<span class="ok">ничего не грозит</span>';
  const m = dg.mobs;
  if (m) {
    lines.push(esc('бой с: ' + (m.mobs || []).map(x => mobRu(x.name) + ' ' + x.d + ' м').join(', ') + ' · оружие: ' + (m.weapon === 'fist' ? 'кулак' : itemRu(m.weapon))));
    lines.push(m.win ? `<span class="ok">отобьётся</span> за ${esc(m.killAllSec)} с, останется ~${esc(m.hpLeft)} HP` : `<span class="bad">проиграет</span>${m.ttdSec != null ? ': умрёт через ' + esc(m.ttdSec) + ' с' : ''}`);
    if ('passiveTtdSec' in m) lines.push('если не отбиваться (копать укрытие, ждать): ' + (m.passiveTtdSec != null ? 'умрёт через ' + esc(m.passiveTtdSec) + ' с' : 'не умрёт'));

  for (const k of ['air', 'fire', 'lava', 'hunger', 'fall', 'damage', 'void']) if (dg[k] && dg[k].ttdSec != null && (!w || w.kind !== k)) lines.push(esc(WORST_RU[k] + ': смерть через ' + dg[k].ttdSec + ' с'));

}

const WHO_CLS = { 'автопилот': 'violet', 'рефлекс': 'blue', 'угроза': 'warn', 'тело': 'dim', 'свой блок': 'warn', 'поведение': 'bad' };

// ---------- Автопилот и рефлексы ----------

// ---------- Мозг ----------

function renderBoxFrames(rec) {

let showSys = false, chatSending = false;
function chatShell() {
  $('p-chat').innerHTML = `<h2>Чат с мозгом</h2>
    <div class="box small dim">Здесь игровой чат (реплики мозга — «Мозг (FlyBot_01)») и твои сообщения из программы. Сообщение мозгу <b>не попадает в игровой чат</b> — мозг увидит его как событие в своей ленте. Текст, начинающийся с «/», не принимается.</div>
    <div style="margin:8px 0"><label class="chk"><input type="checkbox" id="chkSys"> показывать системные строки сервера</label></div>
    <div class="feed" id="chatFeed"></div>
    <div class="compose"><textarea id="chatText" maxlength="300" placeholder="Написать мозгу… (Enter — отправить, Shift+Enter — новая строка)"></textarea><button id="chatSend">Отправить</button></div>
    <div id="chatStatus" class="small dim" style="margin-top:6px"></div>`;
  $('chkSys').onchange = e => { showSys = e.target.checked; tick(); };
  $('chatSend').onclick = sendChat;
  $('chatText').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); } });
}
function renderChat(d) {
  if (!$('chatFeed')) chatShell();
  const f = $('chatFeed');
  const atBottom = f.scrollTop + f.clientHeight >= f.scrollHeight - 30;
  f.innerHTML = d.items.length ? d.items.map(m => `<div class="msg ${m.role}"><div class="meta">${tm(m.ts)} · <b class="${m.role === 'owner' ? 'ok' : m.role === 'brain' ? 'blue' : ''}">${esc(m.who)}</b></div>${esc(m.text)}</div>`).join('') : '<div class="msg dim">В чате пока ничего нет.</div>';
  if (atBottom || !f.dataset.init) { f.scrollTop = f.scrollHeight; f.dataset.init = '1'; }
  $('chkSys').checked = showSys;
}
async function sendChat() {
  const ta = $('chatText'), st = $('chatStatus');
  const text = ta.value.trim();
  if (!text || chatSending) return;
  if (text.startsWith('/')) { st.className = 'small bad'; st.textContent = 'Нельзя: сообщение не должно начинаться с «/».'; return; }
  chatSending = true; $('chatSend').disabled = true; st.className = 'small dim'; st.textContent = 'отправляю…';
  try {
    const r = await fetch('/api/say', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
    const j = await r.json();
    if (j.ok) { ta.value = ''; st.className = 'small ok'; st.textContent = 'Отправлено мозгу. Он увидит сообщение, когда опросит ленту событий.'; }
    else { st.className = 'small bad'; st.textContent = 'Не отправлено: ' + (j.error || '?'); }
  } catch (e) { st.className = 'small bad'; st.textContent = 'Не отправлено: ' + e.message; }
  chatSending = false; $('chatSend').disabled = false; tick();
}

    }
    $('md-run-' + id).innerHTML = run;
    const sel = $('md-sel-' + id);
    const key = JSON.stringify([d.free.list, r.model]);
    if (sel.dataset.key !== key) {
      const keep = sel.dataset.touched ? sel.value : r.model;
      const list = d.free.list.includes(r.model) ? d.free.list : [r.model, ...d.free.list];
      sel.innerHTML = list.map(m => `<option value="${esc(m)}">${esc(m)}${m === r.model && !d.free.list.includes(m) ? ' (сейчас; нет в списке бесплатных)' : ''}</option>`).join('');
      sel.value = list.includes(keep) ? keep : r.model;
      sel.dataset.key = key;
    }
  }
  const f = d.free;
  $('mdFree').className = 'small ' + (f.from === 'opencode' ? 'dim' : 'warn');
  $('mdFree').textContent = f.from === 'opencode' ? `Список: ${f.list.length} бесплатных, получен от opencode ${tm(f.at)}.`
    : f.from === 'кэш на диске' ? `Список из кэша на диске (${tm(f.at)}): opencode не ответил (${f.error}).`
    : `Списка нет: ${f.error}. Впиши id вручную.`;
}
async function saveModel(role) {
  const st = $('md-st-' + role), btn = $('md-save-' + role);
  const man = $('md-man-' + role).value.trim();
  const model = man || $('md-sel-' + role).value;
  if (!model) { st.className = 'small bad'; st.textContent = 'Модель не выбрана.'; return; }
  btn.disabled = true; st.className = 'small dim'; st.textContent = 'сохраняю…';
  try {
    const r = await fetch('/api/models', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ [role]: model }) });
    const j = await r.json();
    if (j.ok) {
      st.className = 'small ok'; st.textContent = 'Сохранено: ' + j.models[role];
      $('md-man-' + role).value = ''; delete $('md-sel-' + role).dataset.touched;
    } else { st.className = 'small bad'; st.textContent = 'Не сохранено: ' + (j.error || '?'); }
  } catch (e) { st.className = 'small bad'; st.textContent = 'Не сохранено: ' + e.message; }
  btn.disabled = false; tick();
}

// ---------- обновление ----------
// ---------- Учитель ----------
let openRep = null;
const TST = { pending: 'warn', working: 'blue', done: 'ok', failed: 'bad', dropped: 'dim' };
function renderTeacher(d) {
  const q = d.queue || {};
  let h = '<h2>Учитель</h2><div class="box small dim">Учитель (модель сейчас: <b>' + esc(d.model || '—') + '</b>) разбирает простой мухи (главное), дорогие смерти, провалы, застревания и подсказки хозяина. Он не управляет мухой и не пишет код: пишет заявки инженеру и на правку ядра. Один случай за раз. <button class="btn2" data-con="teacher">Журнал учителя в консоли</button></div>';
  if (!q.exists) h += '<div class="box warn">Очереди ещё нет: сторож с учителем не запускался (data/teacher_queue.json).</div>';
  h += `<div class="grid" style="margin-top:12px">
    <div class="card"><div class="t">Ждут разбора</div><div class="v">${q.pending || 0}</div></div>
    <div class="card"><div class="t">Сейчас разбирает</div><div class="v small">${esc(q.working || '—')}</div></div>
    <div class="card"><div class="t">Пропущено повторов / выброшено</div><div class="v">${q.suppressed || 0} / ${q.dropped || 0}</div></div></div>`;
  h += '<h2>Очередь случаев</h2>';
  if (!d.cases.length) h += '<div class="box dim">Случаев нет.</div>';
  else {
    h += '<table><tr><th>Случай</th><th>Статус</th><th>Когда</th><th>Сигналы</th></tr>';
    for (const c of d.cases) {
      const sig = c.signals.map(s => `<div class="small">${esc(s.text)} <span class="dim">[${esc(s.ref)}${s.by ? ', ' + esc(byRu(s.by)) : ''}]</span></div>`).join('') + (c.more ? `<div class="dim small">и ещё ${c.more}</div>` : '');
      h += `<tr><td><b>${esc(c.typeRu)}</b><div class="dim small">${esc(c.id)}</div></td><td><span class="tag ${TST[c.status] || ''}">${esc(c.statusRu)}</span>${c.result ? `<div class="dim small">${esc(c.result)}</div>` : ''}</td><td>${tm(c.firstAt)}<div class="dim small">${ago(c.lastAt, d.now)}</div></td><td>${sig}</td></tr>`;
    }
    h += '</table>';
  }
  h += '<h2>Отчёты <span class="dim small">(data/teacher; нажми — текст и журнал учителя)</span></h2>';
  if (!d.reports.length) h += '<div class="box dim">Отчётов пока нет.</div>';
  else {
    h += '<table><tr><th>Когда</th><th>Что случилось</th><th>Вердикт</th></tr>';
    for (const r of d.reports) {
      h += `<tr class="click" data-rep="${esc(r.name)}"><td>${tm(r.ts)}<div class="dim small">${ago(r.ts, d.now)}</div></td><td>${esc(r.title || r.name)}</td><td class="small">${esc(r.verdict)}</td></tr>`;
      if (openRep === r.name) h += `<tr><td colspan="3"><div id="repDetail" class="detail dim">загружаю…</div></td></tr>`;
    }
    h += '</table>';
  }
  h += '<h2>Запросы на правку ядра</h2><div class="box small dim">Запросы на правку ядра и кнопка «Разрешить» — во вкладке «Инженер».</div>';
  return h;
}
// Запросы на правку ядра: пишут мозг и учитель, хозяин разрешает кнопкой, инженер правит с тестами (иначе откат)
const CST = { new: 'warn', approved: 'blue', working: 'blue', done: 'ok', reverted: 'bad', failed: 'bad' };
let openCore = null;
function renderCore(c) {
  let h = '<h2>Запросы на правку ядра <span class="dim small">(brain/core_requests.md: пишут мозг и учитель. «Разрешить» — сторож отдаст запрос инженеру, тот поправит ядро и прогонит тесты; стали хуже — правка откатывается. Без твоего разрешения ядро не трогают)</span></h2>';
  if (!c || !c.ok) return h + `<div class="box bad">${esc((c && c.error) || 'нет данных')}</div>`;
  if (!c.items.length) return h + '<div class="box dim">Запросов нет.</div>';
  h += '<table><tr><th>Запрос</th><th>Статус</th><th></th></tr>';
  for (const it of c.items) {
    const can = it.status !== 'working' && it.status !== 'approved';
    // «сделано» — разрешать снова не нужно; кнопка только чтобы переделать заново (с подтверждением)
    const btn = !can ? '' : it.status === 'done'
      ? `<button class="btn2" data-approve="${esc(it.id)}" data-redo="1" title="Уже сделано, тесты прошли. Нажимать не нужно — только если надо отдать инженеру переделать">Переделать заново</button>`
      : `<button data-approve="${esc(it.id)}">${it.status === 'new' ? 'Разрешить' : 'Разрешить снова'}</button>`;
    h += `<tr class="click" data-core="${esc(it.id)}"><td><b>${esc(it.title)}</b><div class="dim small">${esc(it.id)}</div></td><td><span class="tag ${CST[it.status] || ''}">${esc(it.statusRu)}</span>${it.note ? `<div class="small">${esc(clipS(it.note, 300))}</div>` : ''}</td><td>${btn}</td></tr>`;
    if (openCore === it.id) h += `<tr><td colspan="3"><div class="detail"><pre>${esc(it.text)}</pre>${it.result ? `<h2>Итог</h2><pre>${esc(it.result)}</pre>` : ''}<div style="margin-top:8px"><button class="btn2" data-con="engineer" data-file="engineer-core-${esc(it.id)}.log">Журнал инженера по этому запросу</button></div></div></td></tr>`;
  }
  return h + '</table>';
}
async function approveCore(id, btn) {
  btn.disabled = true; btn.textContent = 'сохраняю…';
  try {
    const r = await fetch('/api/core_requests/approve', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
    const j = await r.json();
    if (!j.ok) alert('Не разрешено: ' + (j.error || '?'));
  } catch (e) { alert('Не разрешено: ' + e.message); }
  tick();
}
async function loadReport() {
  if (!openRep) return;
  const box = $('repDetail'); if (!box) return;
  const d = await get('/api/teacher_report?name=' + encodeURIComponent(openRep));
  if (!d.ok) { box.textContent = d.error; return; }
  const log = (d.log || []).filter(e => e.k === 'text' || e.k === 'err' || e.k === 'tool').slice(0, 40).map(e => `<div class="small ${e.k === 'err' ? 'bad' : e.k === 'tool' ? 'dim' : ''}">${esc(e.text)}</div>`).join('');
  box.classList.remove('dim');
  box.innerHTML = `<button class="btn2" data-con="teacher" data-file="teacher-${esc(openRep.replace(/-[a-z]+\.md$/, ''))}.log">Весь журнал учителя по этому случаю — в консоли</button><h2>Отчёт</h2><pre>${esc(d.text)}</pre><h2>Журнал учителя${d.logMtime ? ' <span class="dim small">(' + tm(d.logMtime) + ')</span>' : ''}</h2>${log || '<div class="dim">журнала нет</div>'}`;
}

// ---------- Витрина навыков ----------
const SC_KIND_RU = { body: 'тело', learned: 'выученный', behavior: 'поведение', variant: 'вариант' };
const fin = x => typeof x === 'number' && isFinite(x) ? x : null;
const clipS = (s, n) => { s = String(s == null ? '' : s); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
function showcaseTable(title, r) {
  let h = '<h2>' + esc(title) + '</h2>';
  if (!r || !r.ok) return h + '<div class="box warn">' + esc((r && r.error) || 'нет данных') + '</div>';
  const d = r.data || {};
  const rows = (Array.isArray(d.skills) ? d.skills : []).filter(s => s && typeof s === 'object' && s.name).slice(0, 400).map(s => {
    const st = s.stats && typeof s.stats === 'object' ? s.stats : {};
    return { s, runs: fin(st.runs), ok: fin(st.ok), fail: fin(st.fail), err: Array.isArray(st.lastErrors) && st.lastErrors.length ? st.lastErrors[st.lastErrors.length - 1] : null };
  });
  rows.sort((a, b) => (b.runs == null ? -1 : b.runs) - (a.runs == null ? -1 : a.runs) || String(a.s.name).localeCompare(String(b.s.name)));
  h += '<div class="dim small" style="margin-bottom:8px">' + esc((d.bot || '?') + (d.version ? ' · ' + d.version : '') + ' · навыков: ' + rows.length) + (d.updated ? ' · собрано ' + tm(Date.parse(d.updated)) : '') + (r.from ? ' · источник: ' + esc(r.from) : '') + '</div>';
  if (r.note) h += '<div class="box warn small" style="margin-bottom:8px">' + esc(r.note) + '</div>';
  h += '<table><tr><th>Навык</th><th>Запусков</th><th>Успех</th><th>Последняя ошибка</th></tr>';
  for (const x of rows) {
    const p = x.runs ? Math.round(x.ok / x.runs * 100) : null;
    const cls = p == null ? 'dim' : p >= 70 ? 'ok' : p >= 40 ? 'warn' : 'bad';
    h += '<tr><td><b>' + esc(clipS(x.s.name, 60)) + '</b> <span class="tag dim small">' + esc(SC_KIND_RU[x.s.kind] || x.s.kind || '?') + '</span>' + (x.s.enabled === false ? ' <span class="tag dim small">выключен мозгом</span>' : '') +
      (x.s.about ? '<div class="dim small">' + esc(clipS(x.s.about, 140)) + '</div>' : '') + '</td><td>' + (x.runs == null ? '—' : x.runs) + '</td><td class="' + cls + '">' + (p == null ? '—' : p + '% <span class="small">(' + x.ok + '/' + x.runs + ')</span>') + '</td><td class="small dim">' + esc(clipS(x.err || '', 110)) + '</td></tr>';
  }
  return h + '</table>';
}
function renderShowcase(d) {
  let h = '<h2>Витрина навыков</h2><div class="box small dim">Две таблицы по одному формату (SHOWCASE.md): наши навыки и навыки соседа (Ассасин, :3099) со статистикой. Прочерк — такой статистики нет; цвет — доля успехов (при малом числе запусков она случайна). Версии навыков сами не выключаются. Учитель смотрит таблицы в каждом разборе и как только у соседа появилось новое: полезное у соседа заказывает инженеру переделать под нашу муху, а полезное у нас отмечает в отчёте для соседа (наша витрина открыта ему).</div>';
  h += '<div class="two" style="margin-top:12px"><div>' + showcaseTable('Наши навыки', d.ours) + '</div><div>' + showcaseTable('Навыки соседа', d.neighbor) + '</div></div>';
  return h;
}

// ---------- Навыки: версии (исполнитель) и способы действий тела (варианты) ----------
const pct = (ok, n) => n ? Math.round(ok / n * 100) + '%' : '—';
const pcls = (ok, n) => !n ? 'dim' : ok / n >= 0.7 ? 'ok' : ok / n >= 0.4 ? 'warn' : 'bad';
function renderSkills(d) {
  let h = '<h2>Версии навыков</h2><div class="box small dim">Навыки, которые написали инженер и учитель (исполнитель, порт 3200). У навыка может быть несколько версий, у каждой свой счёт. <b>Версии сами не выключаются</b>: какую запускать, решает мозг по счёту (лучшие сверху); выключить или вернуть версию может только он.</div>';
  const c = d.catalog || {};
  if (!c.ok) h += '<div class="box warn">' + esc(c.error || 'нет данных') + '</div>';
  else {
    h += '<table><tr><th>Навык</th><th>Версии: запусков, успех</th></tr>';
    for (const g of c.skills) {
      const vs = (g.versions || []).map(v => `<div><b>${esc(v.name)}</b> — ${esc(v.runs || 0)} зап., <span class="${pcls(v.ok || 0, v.runs || 0)}">${pct(v.ok || 0, v.runs || 0)}</span> <span class="dim small">(ок ${esc(v.ok || 0)} / провал ${esc(v.fail || 0)})</span>${v.enabled === false ? ' <span class="tag dim small">выключена мозгом</span>' : ''}${v.note ? '<div class="dim small">' + esc(clipS(v.note, 160)) + '</div>' : ''}</div>`).join('');
      h += `<tr><td><b>${esc(g.base)}</b>${g.description ? '<div class="dim small">' + esc(clipS(g.description, 160)) + '</div>' : ''}${(g.broken || []).length ? '<div class="bad small">не загружаются: ' + esc(g.broken.join(', ')) + '</div>' : ''}</td><td class="small">${vs || '—'}</td></tr>`;
    }
    h += '</table>';
  }
  const v = d.variants || {}, fam = v.families || {};
  h += '<h2>Способы действий тела (варианты)</h2><div class="box small dim">У некоторых действий тела (бегство, укрытие, подъём, спуск, дорога домой, подход к блоку, установка, ближний бой) есть несколько способов. Тело запоминает счёт каждого способа в похожей обстановке (против кого, день или ночь, под землёй ли, оружие, здоровье) и берёт лучший, иногда пробует другой, чтобы счёт не застыл. Счёт от 0 до 1: 1 — сделал быстро и без урона. «Всё вместе» — по всем обстановкам.</div>';
  if (v.note) h += '<div class="box small warn">' + esc(v.note) + '</div>';
  if (v.line) h += '<div class="box small">' + esc(v.line) + '</div>';
  const names = [...new Set([...Object.keys(fam), ...Object.keys(v.stats || {})])];
  if (!names.length) h += '<div class="box dim">Счёта ещё нет.</div>';
  h += '<div class="two" style="margin-top:8px">';
  for (const n of names) {
    const st = (v.stats || {})[n] || {}, F = fam[n] || {};
    const keys = Object.keys(st).filter(k => !k.includes('|')).sort((a, b) => a === '*' ? -1 : b === '*' ? 1 : a.localeCompare(b));
    const deep = Object.keys(st).length - keys.length;
    let t = `<div><h2>${esc(F.label || n)} <span class="dim small">(${esc(n)})</span></h2>`;
    if (F.variants && F.variants.length) t += '<div class="small dim" style="margin-bottom:6px">' + F.variants.map(x => '<b>' + esc(x.name) + '</b> — ' + esc(x.desc)).join('<br>') + '</div>';
    if (!keys.length) t += '<div class="box dim small">Ещё ни разу не выбирался.</div>';
    else {
      t += '<table><tr><th>Обстановка</th><th>Способ: раз, успех, счёт</th></tr>';
      for (const k of keys) {
        const rows = Object.entries(st[k]).map(([vn, x]) => ({ vn, n: x.n || 0, ok: x.ok || 0, avg: x.avg != null ? x.avg : x.n ? x.sum / x.n : null })).sort((a, b) => (b.avg || 0) - (a.avg || 0));
        t += `<tr><td>${k === '*' ? '<b>всё вместе</b>' : esc(mobRu(k))}</td><td class="small">${rows.map(r => `<div><b>${esc(r.vn)}</b> — ${esc(r.n)} раз, <span class="${pcls(r.ok, r.n)}">${pct(r.ok, r.n)}</span>, счёт ${r.avg == null ? '—' : esc(Math.round(r.avg * 100) / 100)}</div>`).join('')}</td></tr>`;
      }
      t += '</table>';
      if (deep) t += '<div class="dim small">и ещё подробных обстановок: ' + deep + '</div>';
    }
    h += t + '</div>';
  }
  h += '</div>';
  const rec = (v.recent || []).slice(-30).reverse();
  if (rec.length) {
    h += '<h2>Последние выборы способа <span class="dim small">(новые сверху)</span></h2><table><tr><th>Когда</th><th>Действие</th><th>Способ</th><th>Обстановка</th><th>Итог</th></tr>';
    for (const r of rec) {
      const ts = typeof r.t === 'number' ? r.t : Date.parse(/Z$|[+-]\d\d:?\d\d$/.test(String(r.t)) ? r.t : r.t + 'Z');
      h += `<tr><td>${tm(ts)}</td><td>${esc((fam[r.family] && fam[r.family].label) || r.family)}</td><td><b>${esc(r.variant)}</b></td><td class="small dim">${esc(r.key || '')}</td><td class="${r.ok ? 'ok' : 'bad'}">${r.ok ? 'вышло' : 'не вышло'}${r.score != null ? ' <span class="dim small">' + esc(Math.round(r.score * 100) / 100) + '</span>' : ''}</td></tr>`;
    }
    h += '</table>';
  }
  return h;
}

const RENDER = {
  body: ['/api/body', renderBody], reflex: ['/api/reflex', renderReflex], brain: ['/api/brain', renderBrain], engineer: ['/api/engineer', renderEngineer],
  deaths: ['/api/deaths', renderDeaths], teacher: ['/api/teacher', renderTeacher], showcase: ['/api/showcase', renderShowcase], skills: ['/api/skills', renderSkills], models: ['/api/models', renderModels], service: ['/api/service', renderService], chat: [() => '/api/chat' + (showSys ? '?system=1' : ''), renderChat]
};
let busy = false;
async function tick() {
  if (busy) return; busy = true;
  try {
    const s = await get('/api/summary'); drawLamps(s);
    if (s.roles) lastRoles = s.roles;
    if (cur === 'console') {
      if (!$('con')) { conShell(); conReset(); }
      renderRoleCards(s.roles, s.now);
      busy = false; await conTick(); return;
    }
    const [u, fn] = RENDER[cur];
    const d = await get(typeof u === 'function' ? u() : u);
    const pane = $('p-' + cur);
    if (cur === 'chat' || cur === 'models') fn(d); // у этих вкладок есть поля ввода — не перерисовываем целиком
    else {
      const y = window.scrollY, feeds = [...pane.querySelectorAll('.feed')].map(f => f.scrollTop);
      pane.innerHTML = fn(d);
      pane.querySelectorAll('.feed').forEach((f, i) => { if (feeds[i]) f.scrollTop = feeds[i]; });
      window.scrollTo(0, y);
      if (cur === 'engineer') loadReq();
      if (cur === 'deaths') loadBox();
      if (cur === 'teacher') loadReport();
    }
  } catch (e) {
    $('lamps').innerHTML = lamp('bad', 'Программа «Аудит» не отвечает: ' + e.message);
  }
  busy = false;
}
document.addEventListener('click', e => {
  const cb = e.target.closest('button[data-con]');
  if (cb) {
    e.stopPropagation();
    cur = 'console'; try { localStorage.setItem('audit.tab', cur); } catch (er) {}
    drawTabs(); if (!$('con')) conShell();
    setConRole(cb.dataset.con, cb.dataset.file || null); tick(); return;
  }
  const ab = e.target.closest('button[data-approve]');
  if (ab) {
    e.stopPropagation();
    if (ab.dataset.redo && !confirm('Этот запрос уже сделан, тесты прошли. Отдать инженеру переделать заново?')) return;
    approveCore(ab.dataset.approve, ab); return;
  }
  const tc = e.target.closest('tr[data-core]');
  if (tc) { openCore = openCore === tc.dataset.core ? null : tc.dataset.core; tick(); }
  const tr = e.target.closest('tr[data-req]');
  if (tr) { openReq = openReq === tr.dataset.req ? null : tr.dataset.req; tick(); }
  const tr2 = e.target.closest('tr[data-rep]');
  if (tr2) { openRep = openRep === tr2.dataset.rep ? null : tr2.dataset.rep; tick(); }
  const tb = e.target.closest('tr[data-box]');
  if (tb) { openBox = openBox === tb.dataset.box ? null : tb.dataset.box; tick(); }
});

drawTabs(); tick();
setInterval(tick, 2500);
</script>
